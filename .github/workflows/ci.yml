name: AGATA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://agata:agata@127.0.0.1:5432/agata
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agata
          POSTGRES_PASSWORD: agata
          POSTGRES_DB: agata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agata -d agata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: PYTHONPATH=. pytest -q
